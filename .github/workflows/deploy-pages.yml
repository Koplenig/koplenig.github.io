name: Deploy personal academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate manual publication CSV
        run: python3 scripts/validate_publications.py
      - name: Prepare static website
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp assets/style.css assets/site.js assets/favicon.svg assets/profile.jpg _site/assets/
          cp data/publications_manual.csv _site/data/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
