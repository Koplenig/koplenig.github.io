name: Deploy personal academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate manual publication CSV
        run: python3 scripts/validate_publications.py
      - name: Render HTML bibliography from manual CSV
        run: python3 scripts/render_publications.py _site
      - name: Prepare static website
        run: |
          mkdir -p _site/assets _site/data
          cp .nojekyll _site/
          cp assets/style.css assets/site.js assets/favicon.svg assets/profile.jpg assets/profile-full.jpg _site/assets/
          cp data/publications_manual.csv _site/data/
      - name: Verify server-rendered publications
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with open("data/publications_manual.csv", encoding="utf-8-sig", newline="") as f:
              csv_rows = list(csv.DictReader(f))
              count = len(csv_rows)
          page = Path("_site/index.html").read_text(encoding="utf-8")
          assert page.count('<article class="publication">') == count, (count, page.count('<article class="publication">'))
          assert "Loading publications" not in page
          assert 'href="https://orcid.org/0000-0002-9630-9680"' in page
          reviews = [r for r in csv_rows if r.get("status", "").strip() == "under_review"]
          dois = sum(bool(r.get("doi", "").strip()) for r in csv_rows)
          preprints = sum(bool(r.get("preprint_url", "").strip()) for r in csv_rows)
          assert page.count('>DOI ↗</a>') == dois, "DOI links missing"
          assert page.count('>Preprint ↗</a>') == preprints, "Preprint links missing"
          assert '<h2 id="under-review-title">Under Review</h2>' in page
          assert page.index('id="under-review-title"') < page.index('id="pub-title"')
          review_section = page.split("<!-- BEGIN_GENERATED_UNDER_REVIEW -->", 1)[1].split("<!-- END_GENERATED_UNDER_REVIEW -->", 1)[0]
          assert review_section.count('<article class="publication">') == len(reviews)
          assert len(reviews) >= 1
          print("Static HTML verified:", count, "works,", len(reviews), "under review,", dois, "DOIs,", preprints, "preprint links")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
