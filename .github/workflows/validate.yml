name: Validate manual publications

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "data/publications_manual.csv"
      - "scripts/validate_publications.py"
      - "assets/**"
      - "index.html"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication CSV
        run: python3 scripts/validate_publications.py
      - name: Check site JavaScript syntax
        run: node --check assets/site.js
      - name: Confirm original IDS snapshot remains available
        run: test -s data/publications_ids.csv
