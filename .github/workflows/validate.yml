name: Validate manual publications

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "data/publications_manual.csv"
      - "scripts/validate_publications.py"
      - "assets/**"
      - "index.html"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication CSV
        run: python3 scripts/validate_publications.py
      - name: Check site JavaScript syntax
        run: node --check assets/site.js
      - name: Render and verify publication links
        run: |
          python3 scripts/render_publications.py _site
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with open("data/publications_manual.csv", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          page = Path("_site/index.html").read_text(encoding="utf-8")
          reviewed = [p for p in rows if p.get("status") == "under_review"]
          assert len(rows) == page.count('<article class="publication">')
          assert page.count('>DOI ↗</a>') == sum(bool(p.get("doi")) for p in rows)
          assert page.count('>Preprint ↗</a>') == sum(bool(p.get("preprint_url")) for p in rows)
          review_mark = '<section class="year-group review-year-group" aria-label="Under Review">'
          assert page.count(review_mark) == 1
          review_section = page.split(review_mark, 1)[1].split('</div></section>', 1)[0]
          assert review_section.count('<article class="publication">') == len(reviewed)
          assert page.index('<h2 id="pub-title">Publications</h2>') < page.index('<h3>Under Review</h3>') < page.index('aria-label="Publications from 2026"')
          assert 'The model-selection results do not support the conclusions drawn from them' in review_section
          print("PASS", len(rows), "records;", len(reviewed), "under review")
          PY
      - name: Confirm original IDS snapshot remains available
        run: test -s data/publications_ids.csv
